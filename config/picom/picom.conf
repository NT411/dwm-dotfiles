corner-radius = 0;
frame-opacity = 1.0;
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = false;

backend = "xrender";
vsync = false;
fading = false;
no-fading-openclose = true;
fade-delta = 8;
fade-in-step = 0.06;
fade-out-step = 0.06;
shadow = false;
shadow-radius = 14;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.32;

rules: ({
  match = "class_g = 'st-256color'";
  opacity = 1.0;
}, {
  match = "window_type = 'dock'";
  corner-radius = 0;
}, {
  match = "class_g = 'slop'";
}, {
  match = "!focused && !group_focused";
  opacity = 1.0;
}, {
  match = "focused || group_focused";
  opacity = 1.0;
})
